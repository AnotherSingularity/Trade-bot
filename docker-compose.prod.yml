# ---------------------------------------------------------------------------
# Production compose — canonical desktop production stack.
#   docker-compose -f docker-compose.prod.yml up -d
# The desktop supervisor pins to this file via HORIZON_COMPOSE_FILE.
# Canonical service names: `db`, `redis`, `server` — enforced by
# apps/desktop/src/main/serviceAdapters.ts service-name contract.
# Provide secrets via an .env file alongside this compose; never
# commit .env.
# ---------------------------------------------------------------------------
services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: on-failure:5
    stop_grace_period: 30s
    ports:
      # Bind to localhost only. Never publish 0.0.0.0.
      - '127.0.0.1:3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=mysql://root:${MYSQL_ROOT_PASSWORD:-password}@db:3306/horizon_trade
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
      - COINBASE_KEY_NAME=${COINBASE_KEY_NAME}
      - COINBASE_PRIVATE_KEY=${COINBASE_PRIVATE_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DRY_RUN=${DRY_RUN:-true}
      - ORDER_SUBMISSION_ENABLED=${ORDER_SUBMISSION_ENABLED:-false}
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health >/dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    # Horizon's canonical database is MariaDB — the migrations and
    # fingerprints (0000-0020_mariadb_fingerprint.json) were all
    # produced against MariaDB. Do not swap to MySQL without a
    # separate database-portability certification.
    image: mariadb:10.11.6
    restart: on-failure:5
    stop_grace_period: 30s
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MARIADB_DATABASE: horizon_trade
    # Localhost-only binding; comment out the port block entirely to
    # keep the DB internal to the compose network. Uncomment only
    # when the operator explicitly needs a client from the host.
    # ports:
    #   - '127.0.0.1:3306:3306'
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mariadb-admin', 'ping', '-h', 'localhost', '-p${MYSQL_ROOT_PASSWORD:-password}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: on-failure:5
    stop_grace_period: 10s
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mariadb_data:
  redis_data:
