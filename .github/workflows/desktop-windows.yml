name: desktop-windows

# Phase 3A §Z — Windows packaging workflow.
#
# Builds the Horizon Trade Desktop operator console into a per-user
# NSIS installer and uploads the artifact for operator install
# verification. This workflow verifies packaging structure — it does
# NOT constitute operational validation.
#
# Explicit posture:
#   - DRY_RUN=true, ORDER_SUBMISSION_ENABLED=false enforced at build.
#   - No live signing (signAndEditExecutable=false in package.json).
#   - No auto-upload to release channels.

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DRY_RUN: 'true'
  ORDER_SUBMISSION_ENABLED: 'false'

jobs:
  lint-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install monorepo dependencies
        run: npm ci
      - name: Typecheck (main + preload + renderer)
        working-directory: apps/desktop
        run: npm run lint
      # Stage 3C-CI-FIX4 §B7: Windows unit job uses the PORTABLE
      # vitest config (vitest.config.ts). Service-dependent tests
      # (MariaDB/Redis probes, external integration) run only in
      # the Linux workflow via `npm run test:external` where
      # MariaDB 10.11.6 + Redis 7.4-alpine are provisioned.
      # A green Windows run establishes: Windows path portability,
      # desktop typecheck, desktop build, service-independent test
      # compatibility. It does NOT establish external-services
      # integration, native Electron runtime verification, or
      # installer readiness.
      - name: Run portable desktop unit suite
        working-directory: apps/desktop
        run: npm test

  package-windows:
    needs: lint-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install monorepo dependencies
        run: npm ci
      - name: Build desktop bundle
        working-directory: apps/desktop
        run: npm run build
      # Stage 3C-CI-FIX5 §Windows: use the declared `build:manifest`
      # package script (tsx) rather than `npx ts-node`. Advantages:
      #   1. tsx is already an installed devDependency — CI never
      #      dynamically downloads an unpinned package.
      #   2. tsx transpiles under ESM+CJS without a bespoke loader.
      #   3. The script is a single source of truth; both CI + a
      #      developer's local shell invoke it identically.
      - name: Generate build manifest
        working-directory: apps/desktop
        run: npm run build:manifest -- dist
        env:
          HORIZON_BUILD_COMMIT: ${{ github.sha }}
      - name: Package Windows NSIS installer
        working-directory: apps/desktop
        run: npm run package:win
        env:
          HORIZON_BUILD_COMMIT: ${{ github.sha }}
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: horizon-trade-desktop-installer
          path: |
            apps/desktop/release/*.exe
            apps/desktop/dist/build-manifest.json
          if-no-files-found: error
          retention-days: 14
