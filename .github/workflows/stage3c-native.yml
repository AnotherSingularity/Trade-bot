name: stage3c-native-electron

# Stage 3C-ENV — the reproducible native Electron integration test.
# Runs on a non-root Linux runner where Chromium's sandbox check does
# not FATAL the renderer child processes. Manual dispatch is the
# primary trigger; every push to the tracked branch also runs it so
# fresh evidence is available for review.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/horizon-trade-bot-mcbcfo
      - main

jobs:
  native:
    name: Stage 3C native Electron
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      # Stage 3C-ENV-FIX §1: pin to the canonical development target
      # engine/version so the native run does not introduce a new
      # database compatibility variable. MariaDB 10.11.6 is Horizon's
      # certified server + migration authoring target; Redis 7.4-alpine
      # matches the production Compose contract.
      mariadb:
        image: mariadb:10.11.6
        env:
          MARIADB_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Stage 3C-ENV-FIX2 §1: install redis-tools so redis-cli is
      # available on the runner. Stage 3C-ENV-FIX2 run classified the
      # prior CI failure as environment/setup — the "Wait for Redis"
      # step above depends on `redis-cli` which is NOT part of the
      # default ubuntu-latest image.
      - name: Install native Electron dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            redis-tools \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libgtk-3-0 \
            libgbm1 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libasound2t64

      - name: Install workspace dependencies
        run: npm ci

      # Stage 3C-CI-FIX3 §B: create the log directory AND emit a
      # bootstrap file so the artefact-upload step always has a real
      # file to upload — GitHub actions/upload-artifact silently
      # skips empty directories, so `if-no-files-found: error` alone
      # would only catch truly-absent trees.
      - name: Prepare native evidence directory
        shell: bash
        run: |
          mkdir -p apps/desktop/tests/native/logs
          cat > apps/desktop/tests/native/logs/ci-bootstrap.txt <<EOF
          workflow_run_id=${GITHUB_RUN_ID}
          commit=${GITHUB_SHA}
          runner_os=${RUNNER_OS}
          native_test_started=false
          harness_launched_at=pending
          note=Overwritten or supplemented by native test evidence.json when the harness actually runs.
          EOF

      - name: Typecheck (shared)
        working-directory: packages/shared
        run: npx tsc --noEmit

      - name: Typecheck (server)
        working-directory: apps/server
        run: npx tsc --noEmit

      - name: Build server
        working-directory: apps/server
        run: npm run build

      - name: Typecheck + build desktop (tsc + vite + esbuild bundle)
        working-directory: apps/desktop
        run: npm run build

      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 30); do
            if mysqladmin -h 127.0.0.1 -u root -ppassword ping >/dev/null 2>&1; then
              echo "mariadb ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "mariadb did not become ready" >&2
          exit 1

      - name: Wait for Redis
        run: |
          for i in $(seq 1 30); do
            if redis-cli -h 127.0.0.1 ping | grep -q PONG; then
              echo "redis ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "redis did not become ready" >&2
          exit 1

      - name: Run Stage 3C native Electron integration test
        working-directory: apps/desktop
        run: npm run test:native
        env:
          NATIVE_DEBUG: '0'

      # Stage 3C-CI-FIX3 §B: upload the directory itself (not
      # `logs/**`) so the ci-bootstrap.txt file always accompanies
      # any subsequent evidence.json. `if-no-files-found: error`
      # is now safe because the Prepare step guarantees at least
      # ci-bootstrap.txt exists.
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3c-native-evidence-${{ github.run_id }}
          path: apps/desktop/tests/native/logs
          retention-days: 30
          if-no-files-found: error

      # Stage 3C-ENV-FIX2 §3: search from the repo root instead of
      # cd'ing into the log directory. The prior step tried
      # `working-directory: apps/desktop/tests/native/logs`, which
      # errors before Bash starts if the directory doesn't exist.
      - name: Print native evidence summary
        if: always()
        shell: bash
        run: |
          find apps/desktop/tests/native/logs -name evidence.json -type f -print0 |
          while IFS= read -r -d '' file; do
            echo "===== $file ====="
            cat "$file"
          done
