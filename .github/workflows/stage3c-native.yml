name: stage3c-native-electron

# Stage 3C-ENV — the reproducible native Electron integration test.
# Runs on a non-root Linux runner where Chromium's sandbox check does
# not FATAL the renderer child processes. Manual dispatch is the
# primary trigger; every push to the tracked branch also runs it so
# fresh evidence is available for review.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/horizon-trade-bot-mcbcfo
      - main

jobs:
  native:
    name: Stage 3C native Electron
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      # Stage 3C-ENV-FIX §1: pin to the canonical development target
      # engine/version so the native run does not introduce a new
      # database compatibility variable. MariaDB 10.11.6 is Horizon's
      # certified server + migration authoring target; Redis 7.4-alpine
      # matches the production Compose contract.
      mariadb:
        image: mariadb:10.11.6
        env:
          MARIADB_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Stage 3C-ENV-FIX2 §1: install redis-tools so redis-cli is
      # available on the runner. Stage 3C-ENV-FIX2 run classified the
      # prior CI failure as environment/setup — the "Wait for Redis"
      # step above depends on `redis-cli` which is NOT part of the
      # default ubuntu-latest image.
      - name: Install native Electron dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            redis-tools \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libgtk-3-0 \
            libgbm1 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libasound2t64

      - name: Install workspace dependencies
        run: npm ci

      # Stage 3C-CI-FIX3 §B: create the log directory AND emit a
      # bootstrap file so the artefact-upload step always has a real
      # file to upload — GitHub actions/upload-artifact silently
      # skips empty directories, so `if-no-files-found: error` alone
      # would only catch truly-absent trees.
      - name: Prepare native evidence directory
        shell: bash
        run: |
          mkdir -p apps/desktop/tests/native/logs
          cat > apps/desktop/tests/native/logs/ci-bootstrap.txt <<EOF
          workflow_run_id=${GITHUB_RUN_ID}
          commit=${GITHUB_SHA}
          runner_os=${RUNNER_OS}
          native_test_started=false
          harness_launched_at=pending
          note=Overwritten or supplemented by native test evidence.json when the harness actually runs.
          EOF

      - name: Typecheck (shared)
        working-directory: packages/shared
        run: npx tsc --noEmit

      - name: Typecheck (server)
        working-directory: apps/server
        run: npx tsc --noEmit

      - name: Build server
        working-directory: apps/server
        run: npm run build

      - name: Typecheck + build desktop (tsc + vite + esbuild bundle)
        working-directory: apps/desktop
        run: npm run build

      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 30); do
            if mysqladmin -h 127.0.0.1 -u root -ppassword ping >/dev/null 2>&1; then
              echo "mariadb ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "mariadb did not become ready" >&2
          exit 1

      - name: Wait for Redis
        run: |
          for i in $(seq 1 30); do
            if redis-cli -h 127.0.0.1 ping | grep -q PONG; then
              echo "redis ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "redis did not become ready" >&2
          exit 1

      # Stage 3C-CI-FIX4 §B8: run the mandatory external-services
      # integration suite BEFORE the native harness. Fast-fail on
      # any schema/probe regression instead of burning wall-clock
      # on Electron. HORIZON_REQUIRE_EXTERNAL_SERVICES=true forces
      # the tests to hard-fail on missing services (Redis probe
      # etc. no longer silently returns).
      - name: Provision horizon_trade_test for external suite
        run: |
          mysql -h 127.0.0.1 -u root -ppassword -e "CREATE DATABASE IF NOT EXISTS horizon_trade_test"
      - name: Run external-services integration suite
        working-directory: apps/desktop
        env:
          HORIZON_REQUIRE_EXTERNAL_SERVICES: 'true'
          HORIZON_MARIADB_URL: mysql://root:password@127.0.0.1:3306/horizon_trade_test
          HORIZON_REDIS_URL: redis://127.0.0.1:6379
        run: npm run test:external

      # Stage 3C-E.1 §C — record the effective identity IMMEDIATELY
      # before the native step so any subsequent failure has direct
      # evidence of who Electron ran as, where its writable dirs
      # were, and what the ownership of the Electron binary + native
      # log directory was. Fails hard if the effective UID is 0 —
      # the canonical CI native contract is non-root and any drift
      # that promotes root must not be silently accepted. See the
      # `id -u == 0` gate.
      - name: Execution identity preflight
        shell: bash
        run: |
          set -euo pipefail
          RUN_LOG_DIR="apps/desktop/tests/native/logs/${GITHUB_RUN_ID}"
          mkdir -p "$RUN_LOG_DIR"
          PREFLIGHT="$RUN_LOG_DIR/identity-preflight.txt"
          {
            echo "===== stage3c-e1 identity preflight ====="
            echo "generatedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runId=${GITHUB_RUN_ID}"
            echo "commit=${GITHUB_SHA}"
            echo "runnerOs=${RUNNER_OS}"
            echo
            echo "----- id / whoami -----"
            id
            echo "id -u => $(id -u)"
            echo "id -g => $(id -g)"
            echo "whoami => $(whoami)"
            echo
            echo "----- HOME / XDG -----"
            printf 'HOME=%s\n' "${HOME:-<unset>}"
            printf 'XDG_RUNTIME_DIR=%s\n' "${XDG_RUNTIME_DIR:-<unset>}"
            printf 'XDG_CACHE_HOME=%s\n' "${XDG_CACHE_HOME:-<unset>}"
            printf 'pwd=%s\n' "$(pwd)"
            echo
            echo "----- Electron binary ownership -----"
            if [ -f node_modules/.bin/electron ]; then
              stat -c '%A %U:%G %n' node_modules/.bin/electron || true
            else
              echo "<node_modules/.bin/electron missing>"
            fi
            echo
            echo "----- native run directory ownership -----"
            stat -c '%A %U:%G %n' "$RUN_LOG_DIR" || true
          } | tee "$PREFLIGHT"
          # Fail if we somehow landed as root. GitHub-hosted
          # ubuntu-latest runs as `runner` (uid 1001); if this fires,
          # the runner selection or job config has drifted.
          if [ "$(id -u)" = "0" ]; then
            echo "stage3c_e1_root_detected: effective UID is 0; canonical native contract requires non-root" >&2
            exit 1
          fi

      - name: Run Stage 3C native Electron integration test
        working-directory: apps/desktop
        run: npm run test:native
        env:
          NATIVE_DEBUG: '0'

      # Stage 3C-CI-FIX5 §8: ARTEFACT ALLOWLIST (not blacklist).
      # FIX4 tried to exclude specific Chromium cache directories but
      # the run artefact still contained e.g. DawnWebGPUCache and
      # other profile bloat. FIX5 inverts to an explicit include list:
      # only diagnostics files and their small companions ship.
      # electron-userdata/ is NEVER uploaded recursively; if a specific
      # profile file becomes useful, it can be copied to a separate
      # diagnostic folder by the harness first.
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3c-native-evidence-${{ github.run_id }}
          path: |
            apps/desktop/tests/native/logs/*.jsonl
            apps/desktop/tests/native/logs/*.json
            apps/desktop/tests/native/logs/*.txt
            apps/desktop/tests/native/logs/*.log
            apps/desktop/tests/native/logs/*.png
            apps/desktop/tests/native/logs/*.html
            apps/desktop/tests/native/logs/**/startup-trace.jsonl
            apps/desktop/tests/native/logs/**/native-run-status.json
            apps/desktop/tests/native/logs/**/failure-classification.json
            apps/desktop/tests/native/logs/**/environment-summary.json
            apps/desktop/tests/native/logs/**/process-tree*.txt
            apps/desktop/tests/native/logs/**/evidence.json
            apps/desktop/tests/native/logs/**/electron-main.stdout.log
            apps/desktop/tests/native/logs/**/electron-main.stderr.log
            apps/desktop/tests/native/logs/**/playwright-api.log
            apps/desktop/tests/native/logs/**/preload.log
            apps/desktop/tests/native/logs/**/renderer.log
            apps/desktop/tests/native/logs/**/server.log
            apps/desktop/tests/native/logs/**/server.live.log
            apps/desktop/tests/native/logs/**/sanitized-*.log
            apps/desktop/tests/native/logs/**/teardown-errors.log
            apps/desktop/tests/native/logs/**/failure.png
            apps/desktop/tests/native/logs/**/failure-dom.html
            apps/desktop/tests/native/logs/**/current-url.txt
            apps/desktop/tests/native/logs/**/identity-preflight.txt
            apps/desktop/tests/native/logs/**/authseam-readiness-diagnostic.json
            apps/desktop/tests/native/logs/**/native-launch-policy.json
          retention-days: 30
          if-no-files-found: error

      # Stage 3C-ENV-FIX2 §3: search from the repo root instead of
      # cd'ing into the log directory. The prior step tried
      # `working-directory: apps/desktop/tests/native/logs`, which
      # errors before Bash starts if the directory doesn't exist.
      - name: Print native evidence summary
        if: always()
        shell: bash
        run: |
          find apps/desktop/tests/native/logs -name evidence.json -type f -print0 |
          while IFS= read -r -d '' file; do
            echo "===== $file ====="
            cat "$file"
          done
