# ---------------------------------------------------------------------------
# Root compose for local development — starts MySQL + Redis only.
# Run the server/mobile via `npm run dev` against these services.
#   docker-compose up -d
# ---------------------------------------------------------------------------
version: '3.8'
services:
  db:
    # Canonical DB engine: MariaDB. Do not swap to MySQL.
    image: mariadb:10.11.6
    environment:
      MARIADB_ROOT_PASSWORD: password
      MARIADB_DATABASE: horizon_trade
    ports:
      - '3306:3306'
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mariadb-admin', 'ping', '-h', 'localhost', '-ppassword']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mariadb_data:
